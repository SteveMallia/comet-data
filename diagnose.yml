name: Diagnose comet fetch

# One-off diagnostic. Run this from the Actions tab, then read the log.
# It makes ONE request to JPL and shows exactly what came back, so we can
# tell the difference between "JPL refused us" and "our parser is wrong".

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: What does JPL actually send back?
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, sys

          url = ("https://ssd.jpl.nasa.gov/api/horizons.api?" + urllib.parse.urlencode({
              "format": "text", "COMMAND": "'DES=10P;CAP;NOFRAG'", "OBJ_DATA": "NO",
              "MAKE_EPHEM": "YES", "EPHEM_TYPE": "OBSERVER", "CENTER": "'500@399'",
              "START_TIME": "'2026-08-20'", "STOP_TIME": "'2026-08-25'",
              "STEP_SIZE": "'1 d'", "QUANTITIES": "'1,9,19,20,23'",
              "CSV_FORMAT": "YES", "ANG_FORMAT": "DEG"}))

          print("REQUEST:", url[:120], "...\n")
          try:
              req = urllib.request.Request(url, headers={
                  "User-Agent": "OntarioTelescope-CometTracker/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("HTTP", r.status)
                  print("headers:", dict(r.headers))
                  body = r.read().decode("utf-8", "replace")
          except Exception as exc:
              print("REQUEST FAILED:", type(exc).__name__, exc)
              # An HTTPError still carries a body, and JPL puts the reason in it.
              if hasattr(exc, "read"):
                  print("--- error body ---")
                  print(exc.read().decode("utf-8", "replace")[:2000])
              sys.exit(0)

          print("\n--- length:", len(body), "chars ---")
          print("--- first 40 lines ---")
          for line in body.splitlines()[:40]:
              print(repr(line))

          if "$$SOE" in body:
              i = body.index("$$SOE")
              print("\n--- the 6 lines BEFORE $$SOE (this is where the header lives) ---")
              for line in body[:i].strip().splitlines()[-6:]:
                  print(repr(line))
              print("\n--- first 3 data rows ---")
              for line in body[i+5:].strip().splitlines()[:3]:
                  print(repr(line))
          else:
              print("\n!! no $$SOE marker — JPL did not return an ephemeris")
          PY

      - name: Now run the real parser on that response
        run: |
          python - <<'PY'
          import importlib.util, urllib.request, urllib.parse
          spec = importlib.util.spec_from_file_location("fc", "fetch_comets.py")
          fc = importlib.util.module_from_spec(spec); spec.loader.exec_module(fc)

          text, err = fc.fetch("DES=10P;CAP;NOFRAG", "2026-08-20", "2026-08-25")
          if text is None:
              print("fetch() failed:", err)
          else:
              rows, perr = fc.parse(text)
              if rows is None:
                  print("parse() failed:", perr)
              else:
                  print("parsed", len(rows), "rows")
                  print("first row:", rows[0])
                  print("sanity_check:", fc.sanity_check("10P", rows) or "clean")
          PY
