name: Find working Horizons syntax

# Horizons started rejecting "DES=10P;CAP;NOFRAG" with:
#     Missing operator in "AP".
# It is parsing CAP as an element filter rather than the closest-apparition
# keyword. This tries every plausible variant and reports which ones return
# a real ephemeris, for both a periodic comet and a C/ comet.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe COMMAND variants
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, time

          def try_cmd(label, command):
              q = {"format": "text", "COMMAND": command, "OBJ_DATA": "NO",
                   "MAKE_EPHEM": "YES", "EPHEM_TYPE": "OBSERVER",
                   "CENTER": "'500@399'", "START_TIME": "'2026-08-20'",
                   "STOP_TIME": "'2026-08-25'", "STEP_SIZE": "'1 d'",
                   "QUANTITIES": "'1,9,19,20,23'", "CSV_FORMAT": "YES",
                   "ANG_FORMAT": "DEG"}
              url = "https://ssd.jpl.nasa.gov/api/horizons.api?" + urllib.parse.urlencode(q)
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "OntarioTelescope-CometTracker/1.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read().decode("utf-8", "replace")
              except Exception as exc:
                  print(f"  {label:38} EXCEPTION {type(exc).__name__}")
                  return False, ""

              if "$$SOE" in body:
                  n = len(body.split("$$SOE")[1].split("$$EOE")[0].strip().splitlines())
                  # show the header line so we can confirm T-mag is present
                  head = body.split("$$SOE")[0].strip().splitlines()
                  hdr = ""
                  for line in reversed(head):
                      s = line.strip()
                      if "date__" in s.lower():
                          hdr = s[:95]
                          break
                  print(f"  {label:38} OK  {n} rows")
                  return True, hdr

              # no ephemeris: show why, skipping the two banner lines
              msg = [l.strip() for l in body.strip().splitlines()[2:] if l.strip()]
              print(f"  {label:38} FAIL  {(msg[0] if msg else '?')[:60]}")
              return False, ""

          print("=== periodic comet: 10P/Tempel ===")
          variants = [
              ("DES=10P;CAP;NOFRAG  (current)", "'DES=10P;CAP;NOFRAG'"),
              ("DES=10P;NOFRAG",               "'DES=10P;NOFRAG'"),
              ("DES=10P;CAP",                  "'DES=10P;CAP'"),
              ("DES=10P;",                     "'DES=10P;'"),
              ("DES=10P",                      "'DES=10P'"),
              ("10P",                          "'10P'"),
              ("10P;",                         "'10P;'"),
              ("DES=10P;CAP<2026-08-23;NOFRAG","'DES=10P;CAP<2026-08-23;NOFRAG'"),
              ("DES=10P;NOFRAG;CAP",           "'DES=10P;NOFRAG;CAP'"),
          ]
          good = []
          for label, cmd in variants:
              ok, hdr = try_cmd(label, cmd)
              if ok:
                  good.append((label, cmd, hdr))
              time.sleep(2)

          print()
          print("=== long-period comet: C/2025 R3 (PANSTARRS) ===")
          for label, cmd in [
              ("DES=C/2025 R3;CAP  (current)", "'DES=C/2025 R3;CAP'"),
              ("DES=C/2025 R3;",              "'DES=C/2025 R3;'"),
              ("DES=C/2025 R3",               "'DES=C/2025 R3'"),
              ("C/2025 R3",                   "'C/2025 R3'"),
              ("DES=C/2025 R3;NOFRAG",        "'DES=C/2025 R3;NOFRAG'"),
          ]:
              try_cmd(label, cmd)
              time.sleep(2)

          print()
          if good:
              print("=== column header returned by the first working variant ===")
              print(" ", good[0][2])
              print()
              print("USE THIS FORM:", good[0][1])
          else:
              print("!! nothing worked — the problem is not the COMMAND syntax")
          PY
